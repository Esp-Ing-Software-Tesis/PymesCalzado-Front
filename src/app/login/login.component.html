<div class="login-container">
  <div class="container-form">
    <div class="logo-title">
      <img src="assets/images/general/logo.webp" class="image_logo" alt="logo" />
      <h1>BIENVENIDO</h1>
    </div>
    <div class="form">
      <p>Ingresa tus credenciales para acceder al sistema de planificación de producción.</p>
      <form action="" method="">
        <div class="inputs">
          <div class="input">
            <input type="email" [(ngModel)]="inputDocument" id="user_email" name="user_email" class="user_email" placeholder="Email" required />
            <svg class="icon">
              <use xlink:href="assets/icons-sprite.svg#login-email"></use>
            </svg>
          </div>
          <div class="input">
            <input
              [type]="passwordVisible ? 'text' : 'password'"
              [(ngModel)]="inputPassword"
              id="user_password"
              name="user_password"
              class="user_password"
              placeholder="Contraseña"
              required
              minlength="8"
            />
            <button type="button" class="icon-button" aria-label="Mostrar u ocultar contraseña" (click)="togglePasswordVisibility()">
              <svg class="icon" focusable="false" aria-hidden="true">
                <use [attr.xlink:href]="passwordVisible ? 'assets/icons-sprite.svg#login-eye' : 'assets/icons-sprite.svg#login-eye-off'"></use>
              </svg>
            </button>
          </div>
          <div class="mensaje_error" *ngIf="errorMessage !== null">
            <svg class="icon">
              <use xlink:href="assets/icons-sprite.svg#login-error"></use>
            </svg>
            <p>{{ errorMessage }}</p>
          </div>
        </div>
        <div class="button-container">
          <button (click)="login()" type="submit" class="button-login">INGRESAR</button>
        </div>
      </form>
    </div>
  </div>
  <div class="image">
    <img src="assets/images/login/imageLogin.webp" class="image_general" alt="collage-lineas-produccion" />
  </div>
</div>
