name: Deploy Frontend to AWS (QA & PROD)

on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - qa

jobs:
  deploy:
    name: Build & Deploy to AWS S3 + CloudFront
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Determinar entorno dinámicamente según la rama
      - name: Set environment variables
        id: env
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "bucket=shoe-factory" >> $GITHUB_OUTPUT
            echo "distribution=E31WCPTILKH4IS" >> $GITHUB_OUTPUT
            echo "env=PROD" >> $GITHUB_OUTPUT
          else
            echo "bucket=shoe-factory-front-qa" >> $GITHUB_OUTPUT
            echo "distribution=E3QXV83K9UDKJX" >> $GITHUB_OUTPUT
            echo "env=QA" >> $GITHUB_OUTPUT
          fi

      - name: Upload assets to S3 with cache
        run: |
          aws s3 cp ./dist/pymes-calzado-front-general/browser s3://${{ steps.env.outputs.bucket }}/ \
          --recursive --cache-control "public, max-age=31536000"

      - name: Upload index.html without cache
        run: |
          aws s3 cp ./dist/pymes-calzado-front-general/browser/index.html s3://${{ steps.env.outputs.bucket }}/ \
          --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.env.outputs.distribution }} \
            --paths "/*"

      - name: Deployment summary
        run: echo "Deployment completed for ${{ steps.env.outputs.env }} environment!"

      # 🔹 Paso adicional: disparar workflow de QA en repo de automatización
      - name: Trigger Cypress tests in automation repo
        if: github.ref == 'refs/heads/qa'
        uses: peter-evans/workflow-dispatch@v2
        with:
          token: ${{ secrets.GH_PAT }}
          repository: Esp-Ing-Software-Tesis/PymesCalzado-Automation-Test
          workflow: run-qa-tests.yml
          ref: main