# desplegar en AWS
name: Deploy Frontend to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to AWS S3 + CloudFront
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2   # Región de tu bucket S3

      - name: Upload assets to S3 with cache
        run: |
          aws s3 cp ./dist/pymes-calzado-front-general/browser s3://shoe-factory/ \
          --recursive --cache-control "public, max-age=31536000"

      - name: Upload index.html without cache
        run: |
          aws s3 cp ./dist/pymes-calzado-front-general/browser/index.html s3://shoe-factory/ \
          --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E31WCPTILKH4IS \
            --paths "/*"