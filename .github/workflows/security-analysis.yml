# flujo para ejecutar CodeQL y Dependabot
name: Security Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 3 * * 1' # Ejecuta semanalmente (lunes a las 3 AM UTC)

jobs:
  analyze:
    name: Run CodeQL & Dependabot check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.27.3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3.27.3

  dependabot:
    name: Dependabot vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        uses: dependabot/fetch-metadata@v2.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}